parse_config:
  preprocess: true
  skip_binding_parsing: false
  raw_binding_map:
    "&caps_word": "CapsWord $$mdi:alpha-w-box$$"
    "&arrow": "->"
    "&double_arrow": "=>"
    "&homedir": "~/"
    "VOL UP": "$$vol_up$$"
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  layer_legend_map: {}
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: '$$mdi:apple-keyboard-control$$'
